[project]
name = "rag-starter"
version = "0.1.0"
description = "Offline academic-literature RAG starter kit: PDF parsing (MinerU), metadata, embeddings, hybrid retrieval."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rag-starter contributors" }]
keywords = ["rag", "retrieval", "chromadb", "mineru", "literature", "offline"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
# bibliography maintenance (`tools/bib_audit.py`)
bib = ["pybtex>=0.24"]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.1.0"]

[project.scripts]
rag-pipeline = "rag_literature.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
